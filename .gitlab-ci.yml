image: golang:1.27

variables:
  GOTOOLCHAIN: "go1.27.0"

stages:
- build
- unittest
- test

build-go:
  stage: build
  script: go build ./...

test-go:
  stage: unittest
  script: go test ./...

test-agent:
  stage: test
  script: make check
  artifacts:
    when: always
    paths:
    - tests/tmp.*

# Succeeds if no changes are suggested by gofmt -d .
gofmt:
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y grep
  script: if gofmt -d . | grep . ; then false ; else true ; fi ; echo test-aaa | grep aaa ; echo test-bbb | grep bbb
